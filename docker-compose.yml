services:
  backend:
    build: ./backend
    container_name: taskpulse-backend
    ports:
      - "5000:5000"
    environment:
      # Absolute path: the Prisma client and CLI both resolve to this exact file.
      # A relative path resolves to different files for each, splitting the DB.
      - DATABASE_URL=file:/app/prisma/dev.db
      - PORT=5000
      - JWT_SECRET=dev_secret_key_123
      # Gupshup WhatsApp (app: Dhabawhatsapp)
      - GUPSHUP_API_KEY=sk_195f8c9ee4cd4c5798a2c9f994c58a6a
      - GUPSHUP_SOURCE_NUMBER=919625587090
      - GUPSHUP_SRC_NAME=Dhabawhatsapp
      - GUPSHUP_TEMPLATE_ID=3a09588b-f293-4134-9b72-b0f0519000a6
      # Optional approved template for the onboarding welcome (leave blank to use
      # a session text, which only delivers within the recipient's 24h window).
      - GUPSHUP_ONBOARDING_TEMPLATE_ID=${GUPSHUP_ONBOARDING_TEMPLATE_ID:-}
      - GUPSHUP_REMOVAL_TEMPLATE_ID=${GUPSHUP_REMOVAL_TEMPLATE_ID:-}
      - DEFAULT_COUNTRY_CODE=91
      # Billing / pricing (paise). Override via root .env.
      - WHATSAPP_PRICE_PAISE=${WHATSAPP_PRICE_PAISE:-50}
      - AI_INPUT_PAISE_PER_MTOK=${AI_INPUT_PAISE_PER_MTOK:-50000}
      - AI_OUTPUT_PAISE_PER_MTOK=${AI_OUTPUT_PAISE_PER_MTOK:-250000}
      - GST_PERCENT=${GST_PERCENT:-18}
      - LOW_BALANCE_PAISE=${LOW_BALANCE_PAISE:-50000}
      - COMPANY_NAME=${COMPANY_NAME:-QverLabs}
      - COMPANY_GSTIN=${COMPANY_GSTIN:-}
      - COMPANY_ADDRESS=${COMPANY_ADDRESS:-}
      - COMPANY_STATE=${COMPANY_STATE:-}
      - INVOICE_PREFIX=${INVOICE_PREFIX:-TP}
      # Razorpay LIVE keys
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
      # LLM classification of inbound WhatsApp messages. Set your Claude API key here.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - FRONTEND_URL=http://localhost:5173
      - WHATSAPP_TEST_RECIPIENT=7838372541
    # Persist the SQLite DB in a named volume so registered users/tasks survive
    # image rebuilds. The volume is initialised from the seeded image on first
    # run; later rebuilds reuse it (use `docker volume rm taskpulse_taskpulse-db`
    # to reset to the seed). A named volume avoids the SQLite file-locking issues
    # that a Windows host bind-mount causes.
    volumes:
      - taskpulse-db:/app/prisma
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: taskpulse-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  taskpulse-db: